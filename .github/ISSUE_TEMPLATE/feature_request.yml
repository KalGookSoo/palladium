name: 기능 요청
description: 새로운 기능/개선을 제안해 주세요.
title: "[기능] "
labels: [enhancement]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: 기능 요약
      description: 제안하는 기능을 한두 문장으로 요약해 주세요.
      placeholder: 예) 타임라인에 크로마키(그린스크린) 합성 이펙트를 추가합니다.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      description: 제안이 해당하는 화면/기능을 선택하세요.
      options:
        - 미디어 가져오기
        - 타임라인/클립 트림
        - 클립 이어붙이기
        - 자막 삽입
        - 내보내기
        - 미리보기/재생
        - 프로젝트 저장/불러오기
        - 파일 접근 권한(샌드박스)
        - 기타
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: 문제/배경
      description: 어떤 문제나 니즈 때문에 이 기능이 필요한가요?
      placeholder: 예) 배경을 지우고 싶은데 현재는 크로마키 합성을 지원하지 않습니다.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방향
      description: 구현 아이디어나 원하는 동작을 간단히 적어 주세요.
      placeholder: 예) 클립에 크로마키 이펙트를 추가하고, 색상 선택 후 배경 클립과 합성한다.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 기대 효과/가치(선택)
      description: 이 기능이 제공할 사용자 가치는 무엇인가요?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 고려했던 대안(선택)
      description: 다른 접근이나 대안이 있었다면 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: usecases
    attributes:
      label: 사용 사례/예시(선택)
      description: 실제 사용 시나리오나 화면 흐름 예시가 있으면 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: docs
    attributes:
      label: 관련 문서(선택)
      description: 관련된 docs/ 문서가 있으면 경로를 적어 주세요(예 docs/video-editing-functional-spec.md, docs/use-cases/trimming.md).
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 추가 정보(선택)
      description: 관련 링크, 레퍼런스, 첨부 자료 등.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 중복 제안을 검색했습니다
          required: true
        - label: 기능 범위와 기대 효과를 간단히 정리했습니다
          required: true
